#@text tab="PADS" cx=28 cy=428 color=ffb15c align=left label="PAD SETTINGS"
enum_v cx=87 cy=590 sw=150 sh=48 label="" key=pad_sel options="PAD 1,PAD 2,PAD 3,PAD 4"
#@text tab="PADS" cx=87 cy=470 color=ffb15c label="EDIT PAD"
popup cx=245 cy=505 w=150 h=48 label="" key=pad_sound cols=3
#@text tab="PADS" cx=245 cy=465 label="SOUND"
button cx=245 cy=610 label="RELOAD" key=pad_reload
knob cx=405 cy=525 r=58 label="ATTACK" key=env_a ns=36 vs=37 bw=128
knob cx=563 cy=525 r=58 label="DECAY" key=env_d ns=36 vs=37 bw=126
knob cx=721 cy=525 r=58 label="SUSTAIN" key=env_s ns=36 vs=37 bw=146
knob cx=879 cy=525 r=58 label="RELEASE" key=env_r ns=36 vs=37 bw=150
readout cx=1114 cy=505 w=300 h=48 label="" key=pad_file
#@text tab="PADS" cx=1114 cy=465 label="LOADED SOUND"
enum_h cx=1114 cy=636 sw=94 sh=52 rows=2 label="" key=pad_roll options="1/8,1/8T,1/16,1/16T,1/32"
#@text tab="PADS" cx=1114 cy=562 label="ROLL BEAT"
qlinks "PADS" = roll_1,roll_2,roll_3,roll_4,-,-,-,-,pad_sel,pad_sound,env_a,env_d,env_s,env_r,pad_roll,-

