#@text tab="SETUP" cx=800 cy=428 color=ffb15c align=left label="RISER"
knob cx=877 cy=534 r=54 label="RISER TUNE" key=noise_tune
knob cx=1035 cy=534 r=54 label="RISER DUCK" key=noise_mod
knob cx=1193 cy=534 r=54 label="NOISE" key=scene_noise
qlinks "SETUP" = lim_drive,lim_ceiling,lim_release,in_gain,iso_lo_freq,iso_hi_freq,build_hpf,break_lpf,noise_tune,noise_mod,scene_noise,preset_slot
