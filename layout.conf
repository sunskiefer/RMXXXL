# RMXXXL v.1 -- MPC page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py, docs/SKIN_STUDIO.md).
# Q-Link lists: keys 1-8 = knob bank 1, 9-16 = bank 2.
scale_names=1
label_scale=1.15
theme_bg=000000
theme_panel=000000
theme_line=262626
theme_ink=f0f0f0
theme_ink_dim=9a9a9a
theme_ink_faint=4a4a4a
theme_accent=ff8a1f
theme_accent_hi=ffb15c
theme_knob_face=141414
theme_knob_ring=ff8a1f
theme_knob_dot=ffffff
theme_bar=000000
theme_seg_active=ff8a1f
theme_seg_inactive=121212
theme_seg_active_tx=111111
theme_btn_text=ffffff
theme_tab_on=ff8a1f
theme_tab_on_tx=111111
theme_lcd=000000
theme_box=000000
qlinks_track = build_up,break_down,filter,echo_send,iso_low,iso_mid,iso_high,rv_send,filter_res,echo_fb,echo_div,release_fx,release_len,scene_noise,lim_ceiling,lim_drive

[tab REMIX]
frame x=10 y=92 w=1258 h=304 title=""
#@text tab="REMIX" cx=28 cy=116 color=ffb15c align=left label="SCENE FX"
knob cx=87 cy=222 r=56 label="BUILD UP" key=build_up
knob cx=245 cy=222 r=56 label="BREAK DOWN" key=break_down
knob cx=403 cy=222 r=56 label="FILTER" key=filter
knob cx=561 cy=222 r=46 label="RESONANCE" key=filter_res
knob cx=719 cy=222 r=46 label="ECHO" key=echo_send
popup cx=877 cy=242 w=134 h=48 label="" key=echo_div
#@text tab="REMIX" cx=877 cy=202 label="ECHO BEAT"
knob cx=1035 cy=222 r=46 label="REVERB" key=rv_send
button cx=1193 cy=222 label="RELEASE" key=release
frame x=10 y=404 w=1258 h=304 title=""
#@text tab="REMIX" cx=28 cy=428 color=ffb15c align=left label="ISOLATOR / RELEASE"
knob cx=87 cy=534 r=56 label="LOW" key=iso_low
knob cx=245 cy=534 r=56 label="MID" key=iso_mid
knob cx=403 cy=534 r=56 label="HIGH" key=iso_high
enum_v cx=561 cy=544 label="" key=release_fx options="ECHO OUT,BRAKE,BACKSPIN"
#@text tab="REMIX" cx=561 cy=472 color=ffb15c label="RELEASE FX"
enum_v cx=719 cy=560 label="" key=release_len options="1/2,1,2,4"
#@text tab="REMIX" cx=719 cy=472 color=ffb15c label="BEATS"
knob cx=877 cy=534 r=46 label="FEEDBACK" key=echo_fb
knob cx=1035 cy=534 r=46 label="NOISE" key=scene_noise
knob cx=1193 cy=534 r=46 label="CEILING" key=lim_ceiling
#@text tab="REMIX" cx=1193 cy=290 color=4a4a4a label="RMXXXL V.1"
#@text tab="REMIX" cx=1160 cy=690 color=3a3a3a label="ANDREALPHEUS"
qlinks "REMIX" = build_up,break_down,filter,echo_send,iso_low,iso_mid,iso_high,rv_send,filter_res,echo_fb,echo_div,release_fx,release_len,scene_noise,lim_ceiling,lim_drive

[tab CLOUDS]
frame x=10 y=92 w=1258 h=304 title=""
#@text tab="CLOUDS" cx=28 cy=116 color=ffb15c align=left label="CLOUDS"
toggle cx=87 cy=222 label="CLOUDS" key=cl_on
popup cx=245 cy=242 w=150 h=48 label="" key=cl_mode options="GRANULAR,STRETCH,LOOP DELAY,SPECTRAL,OLIVERB,RESONESTOR"
#@text tab="CLOUDS" cx=245 cy=202 label="MODE"
knob cx=403 cy=222 r=46 label="POSITION" key=cl_position
knob cx=561 cy=222 r=46 label="SIZE" key=cl_size
knob cx=719 cy=222 r=46 label="PITCH" key=cl_pitch
knob cx=877 cy=222 r=46 label="DENSITY" key=cl_density
knob cx=1035 cy=222 r=46 label="TEXTURE" key=cl_texture
knob cx=1193 cy=222 r=46 label="BLEND" key=cl_blend
frame x=10 y=404 w=1258 h=304 title=""
#@text tab="CLOUDS" cx=28 cy=428 color=ffb15c align=left label="CLOUDS MORE"
knob cx=87 cy=534 r=46 label="SPREAD" key=cl_spread
knob cx=245 cy=534 r=46 label="FEEDBACK" key=cl_feedback
knob cx=403 cy=534 r=46 label="CLOUD VERB" key=cl_reverb
toggle cx=561 cy=534 label="FREEZE" key=cl_freeze
toggle cx=719 cy=534 label="REVERSE" key=cl_reverse
popup cx=877 cy=554 w=150 h=48 label="" key=cl_quality options="16-BIT ST,16-BIT MONO,8-BIT ST,8-BIT MONO"
#@text tab="CLOUDS" cx=877 cy=514 label="QUALITY"
button cx=1035 cy=534 label="TRIGGER" key=cl_trigger
knob cx=1193 cy=534 r=46 label="SCENE DEPTH" key=cl_scene
qlinks "CLOUDS" = cl_position,cl_size,cl_pitch,cl_density,cl_texture,cl_blend,cl_feedback,cl_spread,cl_reverb,cl_scene,cl_mode,cl_on,cl_freeze,cl_reverse,cl_quality

[tab REVERB / PADS]
frame x=10 y=92 w=1258 h=304 title=""
#@text tab="REVERB / PADS" cx=28 cy=116 color=ffb15c align=left label="REVERB"
enum_v cx=87 cy=262 label="" key=rv_type options="PLATE,ROOM,HALL,CLOUDS"
#@text tab="REVERB / PADS" cx=87 cy=174 color=ffb15c label="TYPE"
knob cx=245 cy=222 r=56 label="REVERB" key=rv_send
knob cx=403 cy=222 r=46 label="DECAY" key=rv_decay
knob cx=561 cy=222 r=46 label="SIZE" key=rv_size
knob cx=719 cy=222 r=46 label="TONE" key=rv_tone
knob cx=877 cy=222 r=46 label="PREDELAY" key=rv_predelay
knob cx=1035 cy=222 r=46 label="WIDTH" key=rv_width
knob cx=1193 cy=222 r=46 label="SCENE DEPTH" key=rv_scene
frame x=10 y=404 w=1258 h=304 title=""
#@text tab="REVERB / PADS" cx=28 cy=428 color=ffb15c align=left label="X-PAD"
button cx=87 cy=534 label="PAD 1" key=pad_kick
button cx=245 cy=534 label="PAD 2" key=pad_snare
button cx=403 cy=534 label="PAD 3" key=pad_clap
button cx=561 cy=534 label="PAD 4" key=pad_hat
knob cx=719 cy=534 r=46 label="PAD LEVEL" key=pad_level
knob cx=877 cy=534 r=46 label="PAD TUNE" key=pad_tune
popup cx=1035 cy=554 w=134 h=48 label="" key=pad_roll
#@text tab="REVERB / PADS" cx=1035 cy=514 label="ROLL BEAT"
knob cx=1193 cy=534 r=46 label="MIDI ROOT" key=pad_root
qlinks "REVERB / PADS" = rv_send,rv_decay,rv_size,rv_tone,rv_predelay,rv_width,rv_scene,pad_level,rv_type,pad_tune,pad_roll,pad_root

[tab PADS]
frame x=10 y=92 w=1258 h=304 title=""
#@text tab="PADS" cx=28 cy=116 color=ffb15c align=left label="PADS"
button cx=165 cy=200 label="1" key=pad_kick
button cx=481 cy=200 label="2" key=pad_snare
button cx=797 cy=200 label="3" key=pad_clap
button cx=1113 cy=200 label="4" key=pad_hat
toggle cx=165 cy=320 label="ROLL 1" key=roll_1
toggle cx=481 cy=320 label="ROLL 2" key=roll_2
toggle cx=797 cy=320 label="ROLL 3" key=roll_3
toggle cx=1113 cy=320 label="ROLL 4" key=roll_4
frame x=10 y=404 w=1258 h=304 title=""
#@text tab="PADS" cx=28 cy=428 color=ffb15c align=left label="PAD SETTINGS"
enum_v cx=87 cy=575 label="" key=pad_sel options="PAD 1,PAD 2,PAD 3,PAD 4"
#@text tab="PADS" cx=87 cy=487 color=ffb15c label="EDIT PAD"
popup cx=245 cy=505 w=150 h=48 label="" key=pad_sound cols=3
#@text tab="PADS" cx=245 cy=465 label="SOUND"
button cx=245 cy=610 label="RELOAD" key=pad_reload
knob cx=403 cy=530 r=56 label="ATTACK" key=env_a
knob cx=561 cy=530 r=56 label="DECAY" key=env_d
knob cx=719 cy=530 r=56 label="SUSTAIN" key=env_s
knob cx=877 cy=530 r=56 label="RELEASE" key=env_r
readout cx=1114 cy=505 w=300 h=48 label="" key=pad_file
#@text tab="PADS" cx=1114 cy=465 label="LOADED SOUND"
popup cx=1114 cy=610 w=200 h=48 label="" key=pad_roll
#@text tab="PADS" cx=1114 cy=570 label="ROLL BEAT"
qlinks "PADS" = env_a,env_d,env_s,env_r,pad_sel,pad_sound,pad_roll,pad_level

[tab SETUP]
frame x=10 y=92 w=1258 h=304 title=""
#@text tab="SETUP" cx=28 cy=116 color=ffb15c align=left label="SETUP"
knob cx=87 cy=222 r=46 label="IN GAIN" key=in_gain
knob cx=245 cy=222 r=46 label="LOW XOVER" key=iso_lo_freq
knob cx=403 cy=222 r=46 label="HIGH XOVER" key=iso_hi_freq
knob cx=561 cy=222 r=46 label="BUILD HPF" key=build_hpf
knob cx=719 cy=222 r=46 label="BREAK LPF" key=break_lpf
knob cx=877 cy=222 r=56 label="LIMIT DRIVE" key=lim_drive
knob cx=1035 cy=222 r=56 label="CEILING" key=lim_ceiling
knob cx=1193 cy=222 r=46 label="RELEASE" key=lim_release
frame x=10 y=404 w=1258 h=304 title=""
#@text tab="SETUP" cx=28 cy=428 color=ffb15c align=left label="MIDI (TRACK OUTPUT: RMXXXL 1)"
#@text tab="SETUP" cx=640 cy=470 color=9a9a9a label="FROM MIDI ROOT:  +0 PAD 1   +1 PAD 2   +2 PAD 3   +3 PAD 4"
#@text tab="SETUP" cx=640 cy=530 color=9a9a9a label="+4..+7  SAME PADS AS ROLLS WHILE HELD   +8  RELEASE"
#@text tab="SETUP" cx=640 cy=590 color=9a9a9a label="RELEASE LATCHES BUILD UP / BREAK DOWN OFF UNTIL BOTH ARE TURNED BACK TO ZERO"
qlinks "SETUP" = lim_drive,lim_ceiling,lim_release,in_gain,iso_lo_freq,iso_hi_freq,build_hpf,break_lpf
