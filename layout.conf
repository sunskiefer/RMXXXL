# RMXXXL v.1.3 -- MPC page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py, docs/SKIN_STUDIO.md).
# Q-Link lists: keys 1-8 = knob bank 1, 9-16 = bank 2. Each page: bank 1 = the top row left to right, bank 2 = the
# bottom row left to right, so Force knob N sits under screen column N ("-" where a column has no turnable control).
scale_names=1
label_scale=1.15
theme_bg=000000
theme_panel=000000
theme_line=262626
theme_ink=f0f0f0
theme_ink_dim=9a9a9a
theme_ink_faint=4a4a4a
theme_accent=ff8a1f
theme_accent_hi=ffb15c
theme_knob_face=141414
theme_knob_ring=ff8a1f
theme_knob_dot=ffffff
theme_bar=000000
theme_seg_active=ff8a1f
theme_seg_inactive=121212
theme_seg_active_tx=111111
theme_btn_text=ffffff
theme_tab_on=ff8a1f
theme_tab_on_tx=111111
theme_lcd=000000
theme_box=000000
qlinks_track = build_up,break_down,filter,filter_res,echo_send,echo_fb,rv_send,release,iso_low,iso_mid,iso_high,echo_div,release_fx,release_len,kill_mode

[tab REMIX]
frame x=10 y=92 w=1258 h=304 title=""
#@text tab="REMIX" cx=28 cy=116 color=ffb15c align=left label="SCENE FX"
knob cx=80 cy=214 r=58 label="BUILD" key=build_up ns=36 vs=37 bw=158
knob cx=240 cy=214 r=58 label="BREAK" key=break_down ns=36 vs=37 bw=158
knob cx=402 cy=214 r=58 label="FILTER" key=filter ns=36 vs=37 bw=126
knob cx=551 cy=223 r=57 label="RES" key=filter_res ns=36 vs=37 bw=147
knob cx=712 cy=222 r=57 label="ECHO" key=echo_send ns=36 vs=37 bw=124
knob cx=873 cy=223 r=57 label="FDBACK" key=echo_fb ns=36 vs=37 bw=159
knob cx=1034 cy=223 r=57 label="VERB" key=rv_send ns=36 vs=37 bw=138
toggle cx=1182 cy=163 label="RELEASE" key=release
#@tog label="RELEASE" w=169 h=62
enum_v cx=1184 cy=321 sw=171 sh=59 label="" key=kill_mode options="HARD,SMOOTH"
frame x=10 y=404 w=1258 h=304 title=""
#@text tab="REMIX" cx=28 cy=428 color=ffb15c align=left label="ISOLATOR"
knob cx=96 cy=509 r=58 label="LOW" key=iso_low ns=36 vs=37 bw=126
knob cx=252 cy=509 r=58 label="MID" key=iso_mid ns=36 vs=37 bw=126
knob cx=407 cy=509 r=58 label="HIGH" key=iso_high ns=36 vs=37 bw=126
toggle cx=91 cy=682 ns=0 label="KILL LOW" key=kill_low
#@tog label="KILL LOW" w=120 h=45
toggle cx=247 cy=682 ns=0 label="KILL MID" key=kill_mid
#@tog label="KILL MID" w=120 h=45
toggle cx=402 cy=682 ns=0 label="KILL HIGH" key=kill_high
#@tog label="KILL HIGH" w=120 h=45
#@text tab="REMIX" cx=500 cy=428 color=ffb15c align=left label="ECHO BEAT"
enum_h cx=879 cy=478 sw=94 sh=56 rows=1 label="" key=echo_div options="1/16,1/8,3/16,1/4,3/8,1/2,3/4,1 BAR"
#@text tab="REMIX" cx=500 cy=530 color=ffb15c align=left label="RELEASE FX"
enum_h cx=684 cy=576 sw=124 sh=56 rows=1 label="" key=release_fx options="ECHO OUT,BRAKE,BACKSPIN"
#@text tab="REMIX" cx=903 cy=530 color=ffb15c align=left label="BEATS"
enum_h cx=1083 cy=576 sw=88 sh=56 rows=1 label="" key=release_len options="1/2,1,2,4"
button cx=684 cy=666 label="RELEASE FX" key=release_go
#@btn key=release_go w=378 h=64
button cx=1083 cy=666 label="PANIC" key=panic
#@btn key=panic w=360 h=64
qlinks "REMIX" = build_up,break_down,filter,filter_res,echo_send,echo_fb,rv_send,release,iso_low,iso_mid,iso_high,echo_div,release_fx,release_len,kill_mode,-

[tab CLOUDS]
frame x=10 y=92 w=1258 h=332 title=""
#@text tab="CLOUDS" cx=28 cy=116 color=ffb15c align=left label="CLOUDS"
#@text tab="CLOUDS" cx=180 cy=116 color=ffb15c align=left label="MODE"
enum_h cx=719 cy=164 sw=178 sh=54 rows=1 label="" key=cl_mode options="GRANULAR,STRETCH,LOOP DELAY,SPECTRAL,OLIVERB,RESONESTOR"
toggle cx=87 cy=196 label="CLOUDS" key=cl_on
knob cx=242 cy=273 r=57 label="POSITION" key=cl_position ns=36 vs=37 bw=161
knob cx=417 cy=273 r=57 label="SIZE" key=cl_size ns=36 vs=37 bw=124
knob cx=598 cy=273 r=57 label="PITCH" key=cl_pitch ns=36 vs=37 bw=124
knob cx=779 cy=273 r=57 label="DENSITY" key=cl_density ns=36 vs=37 bw=146
knob cx=960 cy=273 r=57 label="TEXTURE" key=cl_texture ns=36 vs=37 bw=154
knob cx=1157 cy=273 r=57 label="BLEND" key=cl_blend ns=36 vs=37 bw=124
button cx=87 cy=340 label="TRIGGER" key=cl_trigger
frame x=10 y=432 w=1258 h=276 title=""
#@text tab="CLOUDS" cx=28 cy=456 color=ffb15c align=left label="CLOUDS MORE"
knob cx=115 cy=537 r=57 label="SPREAD" key=cl_spread ns=36 vs=37 bw=138
knob cx=316 cy=535 r=57 label="FDBACK" key=cl_feedback ns=36 vs=37 bw=175
knob cx=517 cy=537 r=57 label="CL VERB" key=cl_reverb ns=36 vs=37 bw=199
toggle cx=719 cy=625 label="FREEZE" key=cl_freeze
toggle cx=719 cy=504 label="REVERSE" key=cl_reverse
#@text tab="CLOUDS" cx=808 cy=456 color=ffb15c align=left label="QUALITY"
enum_h cx=960 cy=552 sw=154 sh=56 rows=2 label="" key=cl_quality options="16 ST,16 MONO,8 ST,8 MONO"
knob cx=1194 cy=535 r=58 label="SCENE DEPTH" key=cl_scene ns=0 vs=37 bw=172
#@text tab="CLOUDS" cx=1194 cy=614 size=36 color=f0f0f0 label="SCENE"
#@text tab="CLOUDS" cx=1194 cy=644 size=36 color=f0f0f0 label="DEPTH"
qlinks "CLOUDS" = cl_on,cl_mode,cl_position,cl_size,cl_pitch,cl_density,cl_texture,cl_blend,cl_spread,cl_feedback,cl_reverb,cl_freeze,cl_reverse,cl_quality,cl_scene,-

[tab REVERB / PADS]
frame x=10 y=92 w=1258 h=304 title=""
#@text tab="REVERB / PADS" cx=28 cy=116 color=ffb15c align=left label="REVERB"
enum_h cx=538 cy=121 sw=158 sh=48 rows=1 label="" key=rv_type options="PLATE,ROOM,HALL,CLOUDS"
#@text tab="REVERB / PADS" cx=187 cy=113 color=ffb15c label="TYPE"
knob cx=101 cy=228 r=58 label="VERB" key=rv_send ns=36 vs=37 bw=138
knob cx=265 cy=231 r=57 label="DECAY" key=rv_decay ns=36 vs=37 bw=124
knob cx=447 cy=231 r=57 label="SIZE" key=rv_size ns=36 vs=37 bw=124
knob cx=629 cy=231 r=57 label="TONE" key=rv_tone ns=36 vs=37 bw=124
knob cx=812 cy=231 r=57 label="PREDELAY" key=rv_predelay ns=36 vs=37 bw=173
knob cx=994 cy=231 r=57 label="WIDTH" key=rv_width ns=36 vs=37 bw=124
knob cx=1176 cy=231 r=57 label="SCENE DEPTH" key=rv_scene ns=0 vs=37 bw=180
#@text tab="REVERB / PADS" cx=1176 cy=310 size=36 color=f0f0f0 label="SCENE"
#@text tab="REVERB / PADS" cx=1176 cy=340 size=36 color=f0f0f0 label="DEPTH"
frame x=10 y=404 w=1258 h=304 title=""
#@text tab="REVERB / PADS" cx=28 cy=428 color=ffb15c align=left label="X-PAD"
button cx=87 cy=534 label="PAD 1" key=pad_kick
button cx=245 cy=534 label="PAD 2" key=pad_snare
button cx=403 cy=534 label="PAD 3" key=pad_clap
button cx=561 cy=534 label="PAD 4" key=pad_hat
knob cx=710 cy=532 r=57 label="PAD LVL" key=pad_level ns=36 vs=37 bw=159
knob cx=871 cy=532 r=57 label="PAD TUN" key=pad_tune ns=36 vs=37 bw=159
enum_v cx=1007 cy=578 sw=94 sh=50 label="" key=pad_roll options="1/8,1/8T,1/16,1/16T,1/32"
#@text tab="REVERB / PADS" cx=1036 cy=428 label="ROLL BEAT"
knob cx=1170 cy=521 r=58 label="MIDI ROOT" key=pad_root ns=36 vs=37 bw=179
qlinks "REVERB / PADS" = rv_type,rv_send,rv_decay,rv_size,rv_tone,rv_predelay,rv_width,rv_scene,-,-,-,-,pad_level,pad_tune,pad_roll,pad_root

[tab PADS]
frame x=10 y=92 w=1258 h=304 title=""
#@text tab="PADS" cx=28 cy=116 color=ffb15c align=left label="PADS"
button cx=165 cy=200 label="1" key=pad_kick
button cx=481 cy=200 label="2" key=pad_snare
button cx=797 cy=200 label="3" key=pad_clap
button cx=1113 cy=200 label="4" key=pad_hat
